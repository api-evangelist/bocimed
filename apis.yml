aid: bocimed
name: BociMed
description: 'Shanghai BociMed Pharmaceutical Research Co., Ltd. (上海博志研新药物研究有限公司)
  is a Chinese pharmaceutical CRO/CDMO founded in 2012 in the Zhangjiang Pharmaceutical
  Valley, Shanghai, with an R&D headquarters in Zhangjiang, a production base in Lingang,
  and a clinical subsidiary in Chengdu. BociMed offers small-molecule chemistry, CMC
  and process development, a portfolio of drug delivery technology platforms (oral,
  injectable, nasal, pulmonary, transdermal, ocular, implant, liposome and exosome),
  clinical research and SMO services, global regulatory registration consulting, and
  commercial API, intermediate and solid-dosage manufacturing. It is a laboratory
  and manufacturing services business rather than a software vendor: it publishes a
  marketing website in Chinese and English and no developer program, public API,
  SDK or machine-readable specification of any kind.'
